<style>

.goal-banner { position:relative; overflow:hidden; margin-bottom:9px; padding:10px; border:1px solid #e3bd6e; border-radius:13px; background:#fff3d7; color:#63430b; font-size:12px; font-weight:800; text-align:center; }
.goal-banner span { position:relative; z-index:1; } .confetti { position:absolute; top:-10px; width:6px; height:9px; opacity:0; animation:confetti-fall 1.8s ease-out infinite; }
.confetti:nth-child(1){left:8%;background:var(--teal);animation-delay:.05s}.confetti:nth-child(2){left:18%;background:#e17a5f;animation-delay:.45s}.confetti:nth-child(3){left:31%;background:#d3a33b;animation-delay:.2s}.confetti:nth-child(4){left:45%;background:#6a93bb;animation-delay:.7s}.confetti:nth-child(5){left:58%;background:#d66b85;animation-delay:.35s}.confetti:nth-child(6){left:71%;background:#538b68;animation-delay:.8s}.confetti:nth-child(7){left:84%;background:#9c79b6;animation-delay:.15s}.confetti:nth-child(8){left:94%;background:#d3a33b;animation-delay:.6s}

.tab-bar { position:absolute; z-index:5; right:0; bottom:0; left:0; display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); padding:6px 5px max(8px,env(safe-area-inset-bottom)); border-top:1px solid var(--line); background:#fff; }

<script>
(()=>{
const initialMembers=[{id:'erien',name:'Erien',role:'Organiser',miles:40000},{id:'naarie',name:'Naarie',role:'Adult member',miles:22000},{id:'wei',name:'Wei',role:'Adult member',miles:12000,student:true},{id:'chen',name:'Chen',role:'Adult member',miles:6000,student:true},{id:'lin',name:'Lin',role:'Junior member',miles:2000}];

const icon={Home:'<svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9H4z"/></svg>',Offers:'<svg viewBox="0 0 24 24"><path d="M3 12V4h8l9 9-8 8z"/><circle cx="7.5" cy="8.5" r="1.2"/></svg>',Earn:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>',Redeem:'<svg viewBox="0 0 24 24"><path d="M3 12l18-8-6 16-3.5-6.5z"/></svg>',Family:'<svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.6-7 10-7 10z"/></svg>'};

function phoneMarkup(side,label,defaultId){return `<section class="device-column"><div class="device-label-row"><p class="device-label">${label}</p><div class="account-switch"><label for="account-${side}">Demo: switch account</label><select id="account-${side}" data-account-select data-default="${defaultId}"></select></div></div><article class="phone" data-phone="${side}" aria-label="Cathay app"><header class="app-header"><div class="header-row"><h2 class="header-title" data-page-title>Family</h2><button class="gear-button" type="button" data-action="settings" aria-label="Pool settings" hidden>⚙</button><span class="header-spacer" data-gear-spacer></span></div><div class="header-row"><div class="pool-pill"><span>Pool <span data-pool-total></span></span><small>family pool</small></div><button class="protected-chip" type="button" data-action="protected"><span aria-hidden="true">●</span> Protected pool</button></div></header><div class="screen-content" data-screen></div><nav class="tab-bar" aria-label="Main navigation">${['Home','Offers','Earn','Redeem','Family'].map(n=>`<button class="tab" type="button" data-tab="${n}" aria-label="${n}"><span class="tab-icon" aria-hidden="true">${icon[n]}</span><span class="tab-label">${n}</span></button>`).join('')}</nav><div class="phone-overlay" data-overlay aria-hidden="true"><section class="bottom-sheet" role="dialog" aria-modal="true" aria-label="Family pool action" data-sheet></section></div></article></section>`;}

const mIndex=id=>Math.max(state.members.findIndex(m=>m.id===id),0);

  transfer:'<svg viewBox="0 0 24 24"><path d="M7 7h11l-3-3M17 17H6l3 3"/></svg>',

};
function quickActions(member){
  if(isJunior(member))return '';
  const pending=state.request?.status==='pending';

function heroMarkup(g,pool){

function hydrate(phone,side){
  const hero=phone.querySelector('[data-hero]');if(!hero)return;
  const pool=Number(hero.dataset.pool),cost=Number(hero.dataset.cost),pct=Math.min(pool/cost*100,100);
  const cnt=hero.querySelector('[data-hero-count]'),prog=hero.querySelector('[data-route-progress]'),plane=hero.querySelector('[data-plane]'),track=hero.querySelector('.route-track');
  const len=track.getTotalLength();
  const apply=(p,q)=>{
    cnt.textContent=fmt(p);prog.setAttribute('stroke-dasharray',`${q} 100`);
    const a=track.getPointAtLength(len*q/100),b=track.getPointAtLength(Math.min(len,len*q/100+2)),c=track.getPointAtLength(Math.max(0,len*q/100-2));
    plane.setAttribute('transform',`translate(${a.x} ${a.y}) rotate(${Math.atan2(b.y-c.y,b.x-c.x)*180/Math.PI})`);
  };
  const id=++tw[side],from=shown[side]||{pool:0,pct:0};shown[side]={pool,pct};
  if((from.pool===pool&&from.pct===pct)||matchMedia('(prefers-reduced-motion: reduce)').matches){apply(pool,pct);return;}
  apply(from.pool,from.pct);
  const t0=performance.now(),dur=700;
  const step=now=>{if(id!==tw[side])return;const k=Math.min((now-t0)/dur,1),e=1-Math.pow(1-k,3);apply(from.pool+(pool-from.pool)*e,from.pct+(pct-from.pct)*e);if(k<1)requestAnimationFrame(step);};
  requestAnimationFrame(step);
}

 {title:'The problem today',say:'Families fly together, but their miles sit in separate accounts. Students drift away after Year 1.',doText:'Starts from a fresh demo.',runLabel:'Restart demo',run(){const k=state.script;state=fresh();state.script={open:true,i:k.i};}},
 {title:'Students feed the pool',say:'Wei pays with his linked card. He has auto-add on, so the miles go straight into the family pool.',doText:'Wei spends HK$3,000.',runLabel:'Run: Wei spends',run(){state.view='app';state.nonMember=false;state.accounts.right='wei';state.tabs.right='Family';state.sheets.right=null;state.autoAdd.wei=true;earnMiles(getMember('wei'),500);}},
 {title:'Parents add miles',say:'Parents move their own miles into the pool. Miles flow both ways.',doText:'Erien adds 5,000 miles.',runLabel:'Run: Erien adds 5,000',run(){state.view='app';state.accounts.left='erien';state.tabs.left='Family';state.sheets.left=null;contribute(getMember('erien'),5000);}},
 {title:'A student fare that grows',say:'Wei is a verified student. Each trip unlocks a bigger discount and also earns miles for the family.',doText:'Wei books his next trip at 10% off.',runLabel:'Run: Wei books a trip',run(){state.view='app';state.verified.wei=true;state.accounts.right='wei';state.sheets.right=null;bookTrip(getMember('wei'));}},
 {title:'Plan a trip together',say:'The family picks a destination and who is flying. The pool covers it, so Wei sends a request.',doText:'Wei requests Seoul for 4.',runLabel:'Run: Wei requests Seoul',run(){state.view='app';state.accounts.right='wei';state.tabs.right='Family';state.sheets.right=null;state.plan.right={tripId:'seoul',memberIds:['naarie','wei','chen','lin']};createRequest('right');}},
 {title:'The organiser approves',say:'Only the organiser approves redemptions. The miles come out of the pool.',doText:'Erien approves.',runLabel:'Run: Erien approves',run(){state.view='app';state.accounts.left='erien';state.tabs.left='Family';state.sheets.left=null;approveRequest();}},
 {title:'Protected by design',say:'There are monthly caps per member. If someone tries to move too much, it is blocked.',doText:'Erien tries to add 20,000 more.',runLabel:'Run: show the cap',run(){state.view='app';state.accounts.left='erien';state.tabs.left='Family';const used=state.usedThisMonth.erien||0;state.sheets.left='transfer';state.feedback.left=`Transfer blocked: this would exceed your ${fmt(state.monthlyCap)}-mile monthly cap. You have ${fmt(Math.max(state.monthlyCap-used,0))} miles remaining.`;}},
 {title:'Why Cathay wins',say:'Students stay with Cathay beyond Year 1, parents join the same goal, and miles get used toward trips.',doText:'Opens the Cathay dashboard.',runLabel:'Run: open Cathay view',run(){state.sheets={left:null,right:null};state.view='cathay';}}
];
function renderScript(){
  const el=document.getElementById('script');
  el.hidden=!state.script.open||state.view==='cathay';
  if(el.hidden)return;
  const i=state.script.i,st=steps[i];
  el.innerHTML=`<div class="script-head"><strong>Demo script</strong><span>Step ${i+1} of ${steps.length}</span></div><div class="script-dots">${steps.map((_,k)=>`<i class="${k===i?'on':k<i?'done':''}"></i>`).join('')}</div><h4>${st.title}</h4><p class="script-say">“${st.say}”</p><p class="script-do">${st.doText}</p><button class="action-button" type="button" data-global-action="script-run">${st.runLabel}</button><div class="script-nav"><button type="button" class="demo-link" data-global-action="script-prev" ${i===0?'disabled':''}>← Back</button><button type="button" class="demo-link" data-global-action="script-next" ${i===steps.length-1?'disabled':''}>Next →</button></div>`;
}
function renderCathay(){
  const el=document.getElementById('cathay'),stage=document.getElementById('stage'),on=state.view==='cathay';
  el.hidden=!on;stage.hidden=on;
  if(!on)return;
  const contributors=state.members.filter(m=>m.miles>0).length,tripsBooked=Object.values(state.studentTrips).reduce((a,b)=>a+b,0);
  const tile=(l,v,n)=>`<div class="kpi"><span>${l}</span><strong>${v}</strong><small>${n}</small></div>`;
  const row=(a,b,c)=>`<li><strong>${a}</strong><span>${b}</span><em>${c}</em></li>`;
  el.innerHTML=`<div class="cathay-card"><div class="cathay-top"><div><p class="eyebrow">Cathay's view</p><h2>What the family pool tells Cathay</h2><p class="cathay-sub">Illustrative dashboard with demo data. In a real pilot these come from Cathay's CRM.</p></div><button class="demo-link" type="button" data-global-action="close-cathay">← Back to the app</button></div><div class="kpis">${tile('Pooled miles',fmt(total()),'live from this demo')}${tile('Members contributing',`${contributors} of ${state.members.length}`,'live from this demo')}${tile('Student trips booked',tripsBooked,'live from this demo')}${tile('Redemptions approved',state.redemptions,'live from this demo')}</div><h3>What the pilot would measure</h3><ul class="pilot">${row('Family pooling rate','Share of linked families who pool miles within 6 months','Source: CRM data. Target agreed before launch')}${row('Student trip share','Student trips taken with Cathay, pilot group vs control group','Source: pilot vs control. Target agreed before launch')}${row('Year-2 student retention','Students still flying Cathay in their second year, pilot vs control','Source: pilot vs control. Target agreed before launch')}</ul><h3>Why it works for Cathay</h3><div class="why"><div><strong>Students stay</strong><span>A fare that grows with every trip gives them a reason to keep flying Cathay.</span></div><div><strong>Parents join in</strong><span>A shared goal gives the whole family a reason to book together.</span></div><div><strong>Miles get used</strong><span>Pooled miles go toward real trips, with caps and approvals protecting the programme.</span></div></div></div>`;
}
function render(){
  if(!phones.children.length)phones.innerHTML=phoneMarkup('left',"Parent's phone · Erien",'erien')+phoneMarkup('right',"Student's phone · Wei",'wei');
  document.querySelectorAll('.phone').forEach(phone=>{
    const side=phone.dataset.phone;
    if(!getMember(state.accounts[side]))state.accounts[side]='erien';
    const account=state.accounts[side],member=getMember(account),tab=state.tabs[side];
    phone.querySelector('[data-pool-total]').textContent=fmt(total());
    const select=phone.parentElement.querySelector('[data-account-select]');
    select.innerHTML=state.members.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('');select.value=account;
    phone.querySelector('[data-page-title]').textContent=tab;phone.querySelectorAll('.header-row')[1].hidden=(state.nonMember&&side==='right'&&tab==='Family');
    phone.querySelector('[data-action="settings"]').hidden=!isOrganiser(member);
    phone.querySelector('[data-gear-spacer]').hidden=isOrganiser(member);
    phone.querySelectorAll('[data-tab]').forEach(b=>b.dataset.tab===tab?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));
    const screen=phone.querySelector('[data-screen]'),top=screen.scrollTop;
    if(tab!=='Family')screen.innerHTML=tabView(tab,side,member);
    else if(state.nonMember&&side==='right')screen.innerHTML=nonMemberView();
    else screen.innerHTML=familyView(side,member);
    screen.scrollTop=top;hydrate(phone,side);
    const overlay=phone.querySelector('[data-overlay]'),sheet=phone.querySelector('[data-sheet]'),kind=state.sheets[side];
    if(kind){sheet.innerHTML=sheetContent(side,kind);overlay.classList.add('open');overlay.setAttribute('aria-hidden','false');}
    else{overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true');sheet.innerHTML='';}
  });
  document.getElementById('view-toggle').textContent=state.nonMember?'Return to family view':"Demo: show a non-member's view";renderScript();renderCathay();
}

function addActivity(name,destination,miles){state.activity.unshift({source:name,destination,miles});state.earnedThisMonth+=miles;}
function openSheet(side,kind){state.feedback[side]='';state.notice='';state.sheets[side]=kind;render();}
function closeSheet(side){state.sheets[side]=null;state.feedback[side]='';render();}
function makeInviteCode(){return Math.random().toString(36).slice(2,8).toUpperCase();}
function deductProportionally(cost){
  const balance=total();if(cost>balance||balance<=0)return false;
  const parts=state.members.map(m=>({m,exact:cost*m.miles/balance}));let assigned=0;
  parts.forEach(p=>{p.d=Math.floor(p.exact);assigned+=p.d;});
  parts.sort((a,b)=>(b.exact-Math.floor(b.exact))-(a.exact-Math.floor(a.exact)));
  for(let i=0;i<cost-assigned;i++)parts[i].d++;
  parts.forEach(p=>{p.m.miles-=p.d;});return true;
}
function earnMiles(member,miles){
  if(state.autoAdd[member.id]){member.miles+=miles;addActivity(member.name,'everyday spending → pool',miles);state.notice=`${fmt(miles)} miles earned and added to the pool automatically.`;}
  else{state.personal[member.id]=(state.personal[member.id]||0)+miles;state.notice=`${fmt(miles)} miles earned. They stay in your own balance until you add them to the pool.`;}
}
function approveRequest(){
  const r=state.request;if(!r||r.status!=='pending')return;
  if(!deductProportionally(r.cost)){state.notice='Not enough miles to approve this request.';state.request=null;return;}
  state.redemptions++;state.activity.unshift({description:`${r.label} redeemed · pool`,miles:-r.cost});
  state.notice=`${r.label} redeemed for ${fmt(r.cost)} miles (${r.members.map(nameOf).join(', ')}).`;state.request=null;
}
function createRequest(side){
  const member=getMember(state.accounts[side]),plan=state.plan[side],trip=tripFor(plan.tripId),n=plan.memberIds.length,cost=trip.rate*n;
  if(!n)return;
  if(cost>total()){state.feedback[side]=`Not enough miles yet: you need ${fmt(cost-total())} more.`;render();return;}
  if(state.request?.status==='pending'){state.feedback[side]='A redemption request is already waiting for the organiser.';render();return;}
  state.request={name:member.name,tripId:trip.id,label:`${trip.name} for ${n}`,destination:trip.name,cost,members:[...plan.memberIds],status:'pending'};
  state.sheets[side]=null;state.feedback[side]='';state.notice='';
  if(isOrganiser(member)||!state.approvalsRequired)approveRequest();
  render();
}

phones.addEventListener('change',e=>{
  const select=e.target.closest('[data-account-select]');
  if(select){const side=select.closest('.device-column').querySelector('.phone').dataset.phone;state.accounts[side]=select.value;state.sheets[side]=null;state.feedback[side]='';render();return;}
  if(e.target.matches('[data-auto-toggle]')){const sd=e.target.closest('.phone').dataset.phone;state.autoAdd[state.accounts[sd]]=e.target.checked;render();return;}
  if(e.target.matches('[data-approval-toggle]')){state.approvalsRequired=e.target.checked;render();return;}
  if(e.target.matches('[data-cap-setting]')){
    const v=Number(e.target.value),sheet=e.target.closest('[data-sheet]');
    if(!Number.isInteger(v)||v<1){const err=sheet.querySelector('[data-settings-error]');if(err)err.textContent='Enter a whole number greater than zero.';return;}
    state.monthlyCap=v;render();
  }
});

phones.addEventListener('submit',e=>{
  const form=e.target.closest('form');if(!form)return;e.preventDefault();
  const kind=form.dataset.form,side=form.dataset.side,data=new FormData(form);
  if(kind==='join'){const code=String(data.get('code')||'').trim();if(!/^[A-Za-z0-9]{6}$/.test(code)){state.feedback.right='Enter the 6-character code from your organiser.';render();return;}state.feedback.right='';state.nonMember=false;state.tabs.right='Family';state.notice='Invite accepted. Welcome to the family pool.';render();return;}
  const member=getMember(state.accounts[side]);
  if(kind==='transfer'){
    const amount=Number(data.get('amount')),used=state.usedThisMonth[member.id]||0;
    if(!Number.isInteger(amount)||amount<=0)state.feedback[side]='Enter a whole number of miles greater than zero.';
    else if(amount>(state.personal[member.id]||0))state.feedback[side]=`You only have ${fmt(state.personal[member.id]||0)} miles in your own balance.`;else if(used+amount>state.monthlyCap)state.feedback[side]=`Transfer blocked: this would exceed your ${fmt(state.monthlyCap)}-mile monthly cap. You have ${fmt(Math.max(state.monthlyCap-used,0))} miles remaining.`;
    else{state.personal[member.id]-=amount;member.miles+=amount;state.usedThisMonth[member.id]=used+amount;addActivity(member.name,'transfer → pool',amount);state.feedback[side]='';state.notice=`${fmt(amount)} miles added to the pool by ${member.name}.`;state.sheets[side]=null;}
    render();return;
  }
  if(kind==='spending'){
    const hkd=Number(data.get('amount'));
    if(!Number.isFinite(hkd)||hkd<6)state.feedback[side]='Enter at least HK$6 to earn a mile.';
    else{const miles=Math.floor(hkd/6);earnMiles(member,miles);state.sheets[side]=null;state.feedback[side]='';}
    render();return;
  }
  if(kind==='invite'){
    const name=String(data.get('name')||'').trim(),role=data.get('role');
    if(!name){state.feedback[side]='Enter a member name.';render();return;}if(role==='junior'&&!data.get('consent')){const er=e.target.querySelector('[data-sheet-error]');if(er)er.textContent='Parental consent is required for members under 18.';return;}
    const id=`member-${Date.now()}`;
    state.members.push({id,name,role:role==='junior'?'Junior member':'Adult member',miles:0});state.usedThisMonth[id]=0;state.personal[id]=0;
    state.inviteCode=makeInviteCode();state.feedback[side]='';state.sheets[side]='settings';render();
  }
});

phones.addEventListener('click',e=>{
  const phone=e.target.closest('.phone');if(!phone)return;
  const side=phone.dataset.phone,member=getMember(state.accounts[side]);
  const overlay=e.target.closest('[data-overlay]');
  if(overlay&&e.target===overlay){closeSheet(side);return;}
  const tab=e.target.closest('[data-tab]');
  if(tab){state.tabs[side]=tab.dataset.tab;state.sheets[side]=null;render();return;}
  const button=e.target.closest('[data-action]');if(!button)return;
  const action=button.dataset.action,junior=isJunior(member),org=isOrganiser(member);
  if(action==='transfer'&&!junior)openSheet(side,'transfer');
  else if(action==='spending'&&!junior)openSheet(side,'spending');
  else if(action==='redeem'&&!junior){state.plan[side]={tripId:state.pinned.tripId,memberIds:[...state.pinned.memberIds]};openSheet(side,'plan');}
  else if(action==='view'){state.views[side]=button.dataset.view;render();}
  else if(action==='focus-member'){state.focus[side]=state.focus[side]===button.dataset.member?null:button.dataset.member;render();}
  else if(action==='demo-shop'&&!junior){earnMiles(member,166);render();}
  else if(action==='plan-seoul'&&!junior){const n=Math.min(state.members.length,Math.floor(total()/trips[0].rate));state.plan[side]={tripId:'seoul',memberIds:state.members.slice(0,Math.max(n,1)).map(m=>m.id)};openSheet(side,'plan');}
  else if(action==='invite-open'&&org){state.inviteCode=state.inviteCode||makeInviteCode();openSheet(side,'settings');}
  else if(action==='book-trip'&&member.student&&state.verified[member.id])openSheet(side,'trip');
  else if(action==='confirm-trip'&&member.student){bookTrip(member);state.sheets[side]=null;render();}
  else if(action==='verify'&&member.student)openSheet(side,'verify');
  else if(action==='confirm-verify'&&member.student){state.verified[member.id]=true;state.notice='Student status verified. Your fare ladder is unlocked.';state.sheets[side]=null;render();}
  else if(action==='goto-family'){state.tabs[side]='Family';render();}
  else if(action==='select-trip'){state.plan[side].tripId=button.dataset.trip;state.feedback[side]='';render();}
  else if(action==='toggle-traveller'){const ids=state.plan[side].memberIds,id=button.dataset.member,i=ids.indexOf(id);if(i>=0)ids.splice(i,1);else ids.push(id);state.feedback[side]='';render();}
  else if(action==='pin-plan'&&state.plan[side].memberIds.length){state.pinned={tripId:state.plan[side].tripId,memberIds:[...state.plan[side].memberIds]};state.notice=`Goal set: ${planName(state.pinned)}.`;state.sheets[side]=null;render();}
  else if(action==='request-trip'&&!junior)createRequest(side);
  else if(action==='review'&&org)openSheet(side,'review');
  else if(action==='settings'&&org)openSheet(side,'settings');
  else if(action==='protected')openSheet(side,'protected');
  else if(action==='close-sheet')closeSheet(side);
  else if(action==='approve'&&org){approveRequest();state.sheets[side]=null;render();}
  else if(action==='decline'&&org){state.request=null;state.notice='Redemption request declined.';state.sheets[side]=null;render();}
  else if(action==='show-invite-code'&&org){state.inviteCode=state.inviteCode||makeInviteCode();render();}
  else if(action==='add-invited'&&org)openSheet(side,'invite');
  else if(action==='remove-member'&&org){
    const id=button.dataset.member;if(id==='erien')return;
    const removed=getMember(id);
    if(removed){
      state.members=state.members.filter(m=>m.id!==id);delete state.usedThisMonth[id];
      state.pinned.memberIds=state.pinned.memberIds.filter(x=>x!==id);if(!state.pinned.memberIds.length)state.pinned.memberIds=[state.members[0].id];
      ['left','right'].forEach(s=>{state.plan[s].memberIds=state.plan[s].memberIds.filter(x=>x!==id);});
      if(state.request&&state.request.members.includes(id))state.request=null;
      state.notice=`${removed.name} left the pool and took back ${fmt(removed.miles)} unspent miles.`;
    }
    render();
  }
  else if(action==='start-pool'){state.nonMember=false;state.tabs.right='Family';state.feedback.right='';state.notice='Your family pool is ready. You are the organiser, so invite your family from Members.';render();}
});

document.addEventListener('click',e=>{
  const action=e.target.closest('[data-global-action]')?.dataset.globalAction;if(!action)return;
  if(action==='toggle-view'){state.nonMember=!state.nonMember;state.tabs.right='Family';render();return;}
  if(action==='reset'){const k=state.script;state=fresh();state.script={open:k.open,i:0};render();return;}
  if(action==='toggle-script'){state.script.open=!state.script.open;if(state.view==='cathay')state.view='app';render();return;}
  if(action==='script-prev'){state.script.i=Math.max(0,state.script.i-1);render();return;}
  if(action==='script-next'){state.script.i=Math.min(steps.length-1,state.script.i+1);render();return;}
  if(action==='script-run'){steps[state.script.i].run();render();return;}
  if(action==='toggle-cathay'){state.view=state.view==='cathay'?'app':'cathay';render();return;}
  if(action==='close-cathay'){state.view='app';render();return;}if(action==='sim-purchase'){const side=(state.nonMember||isJunior(getMember(state.accounts.right)))?'left':'right';if(isJunior(getMember(state.accounts[side])))return;state.tabs[side]='Family';openSheet(side,'spending');}
});
render();
})();
</script>
