<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F5F3EE">
  <title>Family | Cathay</title>
  <style>
    :root {
      color-scheme: light;
      --teal: #005B4D;
      --paper: #F5F3EE;
      --page: #e8e8e6;
      --ink: #20302d;
      --muted: #727b77;
      --line: #e8e6e0;
      --white: #fff;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--page);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button { font: inherit; }

    .phone {
      position: relative;
      display: flex;
      width: min(390px, 100%);
      height: min(844px, calc(100dvh - 48px));
      min-height: 620px;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid rgb(29 44 39 / 8%);
      border-radius: 34px;
      background: var(--paper);
      box-shadow: 0 24px 70px rgb(26 39 34 / 18%), 0 4px 12px rgb(26 39 34 / 8%);
    }

    .app-header {
      min-height: 184px;
      padding: max(24px, env(safe-area-inset-top)) 24px 26px;
      background: var(--teal);
      color: var(--white);
    }

    .miles-chip {
      display: inline-flex;
      min-height: 34px;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border: 1px solid rgb(255 255 255 / 28%);
      border-radius: 999px;
      background: rgb(255 255 255 / 12%);
      color: #fff;
      font-size: 13px;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
      letter-spacing: .01em;
    }

    .miles-icon {
      display: grid;
      width: 20px;
      height: 20px;
      place-items: center;
      border-radius: 50%;
      background: #fff;
      color: var(--teal);
      font-size: 11px;
      font-weight: 800;
    }

    .app-header h1 {
      margin: 28px 0 0;
      font-size: 32px;
      font-weight: 650;
      line-height: 1.15;
      letter-spacing: -.035em;
    }

    .content {
      flex: 1;
      background: var(--paper);
    }

    .tab-bar {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      flex: 0 0 auto;
      padding: 9px 5px max(10px, env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
      background: rgb(255 255 255 / 96%);
    }

    .tab {
      display: flex;
      min-width: 0;
      min-height: 58px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 4px 1px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .tab-icon {
      display: grid;
      width: 23px;
      height: 23px;
      place-items: center;
      font-size: 19px;
      line-height: 1;
    }

    .tab-label {
      font-size: 10px;
      font-weight: 550;
      line-height: 1.2;
      white-space: nowrap;
    }

    .tab[aria-current="page"] {
      color: var(--teal);
    }

    .tab[aria-current="page"] .tab-label { font-weight: 750; }
    .tab:focus-visible { outline: 2px solid var(--teal); outline-offset: -2px; }

    @media (max-width: 430px) {
      body { padding: 0; }
      .phone {
        width: 100%;
        height: 100vh;
        height: 100dvh;
        min-height: 560px;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }
      .app-header { min-height: 190px; }
    }

    @media (max-height: 700px) and (min-width: 431px) {
      body { padding: 12px; }
      .phone { height: calc(100dvh - 24px); min-height: 560px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="phone" aria-label="Cathay mobile app">
    <header class="app-header">
      <div class="miles-chip" aria-label="Available miles: 245,000">
        <span class="miles-icon" aria-hidden="true">A</span>
        <span>245,000</span>
      </div>
      <h1 id="page-title">Family</h1>
    </header>

    <section class="content" aria-label="Family page"></section>

    <nav class="tab-bar" aria-label="Main navigation">
      <button class="tab" type="button" data-title="Home" aria-label="Home">
        <span class="tab-icon" aria-hidden="true">⌂</span><span class="tab-label">Home</span>
      </button>
      <button class="tab" type="button" data-title="Offers" aria-label="Offers">
        <span class="tab-icon" aria-hidden="true">◇</span><span class="tab-label">Offers</span>
      </button>
      <button class="tab" type="button" data-title="Earn" aria-label="Earn">
        <span class="tab-icon" aria-hidden="true">＋</span><span class="tab-label">Earn</span>
      </button>
      <button class="tab" type="button" data-title="Redeem" aria-label="Redeem">
        <span class="tab-icon" aria-hidden="true">✈</span><span class="tab-label">Redeem</span>
      </button>
      <button class="tab" type="button" data-title="Family" aria-label="Family" aria-current="page">
        <span class="tab-icon" aria-hidden="true">♡</span><span class="tab-label">Family</span>
      </button>
      <button class="tab" type="button" data-title="Profile" aria-label="Profile">
        <span class="tab-icon" aria-hidden="true">○</span><span class="tab-label">Profile</span>
      </button>
    </nav>
  </main>

  <script>
    const tabs = document.querySelectorAll('.tab');
    const pageTitle = document.getElementById('page-title');

    tabs.forEach((tab) => {
      tab.addEventListener('click', () => {
        tabs.forEach((item) => item.removeAttribute('aria-current'));
        tab.setAttribute('aria-current', 'page');
        pageTitle.textContent = tab.dataset.title;
      });
    });
  </script>
</body>
</html>
